<!-- The main page is written in plain HTML so that it displays even if every script fails (REQ-109) -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MIL slide analysis (research demo)</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header>
    <h1>MIL slide analysis</h1>
    <p class="notice">Research demo - not for clinical use</p>
  </header>

  <div id="offline-banner" class="banner" hidden></div>

  <main>
  <section class="slides" aria-labelledby="slides-heading">
    <h2 id="slides-heading">Slides</h2>
    <p id="slide-list-status" class="muted" aria-live="polite"></p>
    <ul id="slide-list" class="slide-list"></ul>
  </section>

  <section class="viewer-panel" aria-labelledby="viewer-heading">
    <h2 id="viewer-heading">Viewer</h2>
    <p id="viewer-message" class="muted">Select a ready slide to view it.</p>
    <div id="viewer" class="viewer" hidden></div>
  </section>
</main>

  <footer>
    <h2>Models</h2>
    <ul id="model-list"></ul>
  </footer>

  <!-- OpenSeadragon is a classic script: it defines a global `OpenSeadragon`.
       It must load before main.js, which uses that global. -->
  <script src="/vendor/openseadragon/openseadragon.min.js"></script>
  <script type="module" src="js/main.js"></script>
  <!-- type="module" lets main.js use import/export; it also runs after the HTML is parsed. -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
